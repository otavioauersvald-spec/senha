<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Bloco Superior: Exibição da Senha -->
    <section class="conteudo">

        <div class="conteudo-titulo">
            <h2 class="titulo-principal">Gerador de senhas</h2>
            <h3 class="titulo-secundario">
                Gere uma senha aleatória
            </h3>
        </div>

        <div class="conteudo-senha">
            <label for="campo-senha">Senha</label>

            <input
                id="campo-senha"
                type="text"
                readonly
            >
        </div>

    </section>


    <!-- Bloco Inferior: Opções -->
    <section class="parametro">

        <h3 class="parametro-titulo">
            Personalize sua senha
        </h3>

        <div class="parametro-coluna__senha">

            <!-- Características -->
            <div class="parametro-senha">

                <h4 class="parametro-senha__titulo">
                    Características da senha
                </h4>

                <div class="parametro-senha-checkbox">
                    <input
                        id="maiusculo"
                        type="checkbox"
                        class="checkbox"
                        checked
                    >

                    <label for="maiusculo">
                        Letras maiúsculas
                    </label>
                </div>

                <div class="parametro-senha-checkbox">
                    <input
                        id="minusculo"
                        type="checkbox"
                        class="checkbox"
                        checked
                    >

                    <label for="minusculo">
                        Letras minúsculas
                    </label>
                </div>

                <div class="parametro-senha-checkbox">
                    <input
                        id="numero"
                        type="checkbox"
                        class="checkbox"
                        checked
                    >

                    <label for="numero">
                        Números
                    </label>
                </div>

                <div class="parametro-senha-checkbox">
                    <input
                        id="simbolo"
                        type="checkbox"
                        class="checkbox"
                    >

                    <label for="simbolo">
                        Símbolos
                    </label>
                </div>

            </div>


            <!-- Tamanho -->
            <div class="parametro-senha">

                <h4 class="parametro-senha__titulo">
                    Número de caracteres
                </h4>

                <div class="parametro-senha-botoes">

                    <button
                        id="diminuir"
                        class="parametro-senha__botao"
                        type="button"
                    >
                        -
                    </button>

                    <p
                        id="tamanho"
                        class="parametro-senha__texto"
                    >
                        12
                    </p>

                    <button
                        id="aumentar"
                        class="parametro-senha__botao"
                        type="button"
                    >
                        +
                    </button>

                </div>

            </div>


            <!-- Força da senha -->
            <div class="parametro-senha">

                <h4 class="parametro-senha__titulo">
                    Força da senha
                </h4>

                <div class="barra"></div>

                <div
                    id="texto-forca"
                    class="parametro-senha-textos"
                >
                    Senha média
                </div>

            </div>


            <!-- Botão gerar -->
            <button
                id="gerar"
                class="botao-gerar"
                type="button"
            >
                Gerar nova senha
            </button>

        </div>

    </section>


    <!-- JavaScript -->
    <script src="main.js"></script>

</body>
</html>
